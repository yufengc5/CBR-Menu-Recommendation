<!doctype html>
<html lang="en">
  <head>
    <title>Preparing menus…</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body{
        margin:0;
        font-family:Poppins, sans-serif;
        background:#EFEFEA;
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        color:#123746;
      }
      .box{ text-align:center; }
      .spinner{
        width:52px;height:52px;
        border:4px solid #d8d8d0;
        border-top:4px solid #e05f3b;
        border-radius:50%;
        animation:spin 1s linear infinite;
        margin:0 auto 14px;
      }
      @keyframes spin{ to{ transform:rotate(360deg);} }
      p{ margin:0; font-size:14px; opacity:0.9; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <p>Preparing your recommended menus…<br>Please wait 🍽️</p>
    </div>

    <script>
  const DEBUG = false;   

    if (DEBUG) {
      const debugData = {{ (debug_data or {}) | tojson | safe }};
      if (Object.keys(debugData).length) {
        alert("USER INPUT:\n\n" + JSON.stringify(debugData, null, 2));
      }
    }

    setTimeout(() => {
      window.location.href = "{{ url_for('recommend_result') }}";
    }, 50);
</script>
  </body>
</html>
