<!doctype html>
<html lang="en">
  <head>
    <title>Menu Input - CBR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #EFEFEA;              /* soft blue like screenshot */
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-wrapper {
        width: 100%;
        max-width: 560px;
        padding: 20px;
      }

      .card {
        background: #e05f3b;             /* teal-ish card */
        border-radius: 18px;
        padding: 32px 36px 40px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.30);
        color: #f5f7f8;
      }

      h1 {
        margin: 0 0 8px 0;
        text-align: center;
        font-weight: 600;
      }

      .subtitle {
        text-align: center;
        font-size: 14px;
        margin-bottom: 22px;
        opacity: 0.9;
      }

      .success-message {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
      }

      input[type="text"],
      input[type="number"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        border-radius: 10px;
        border: 2px solid transparent;
        padding: 10px 12px;
        margin-bottom: 14px;
        outline: none;
        font-size: 14px;
        font-family: inherit;
        background: #f3f7fa;
        color: #222;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #275a73;
        box-shadow: 0 0 0 3px rgba(39, 90, 115, 0.2);
      }

      textarea {
        resize: vertical;
      }

      .checkbox-group {
        margin-bottom: 10px;
      }

      .checkbox-group label {
        display: block;
        font-weight: 400;
        margin-bottom: 3px;
      }

      .section-title {
        font-size: 15px;
        font-weight: 600;
        margin: 10px 0 6px;
        text-align: left;
      }

      .helper-text {
        font-size: 11px;
        opacity: 0.9;
        margin-top: -8px;
        margin-bottom: 12px;
      }

      button {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: #0B1B3A;           /* deep blue button, not pure red */
        color: white;
        transition: background 0.2s ease, transform 0.1s ease,
                    box-shadow 0.2s ease;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        margin-top: 4px;
      }

      button:hover {
        background: #184868;
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.32);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>

  <body>
    <div class="card-wrapper">
      <div class="card">
        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
